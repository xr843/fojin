server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # Security headers — see security-headers.conf. Must be re-included in every
    # location that sets its own add_header (nginx drops inherited headers there).
    include /etc/nginx/security-headers.conf;

    # Serve pre-compressed .gz files when available
    gzip_static on;

    # Fallback dynamic gzip for non-precompressed responses
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Static assets with content hash — immutable long cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # Font files — long cache
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # i18n resource files — un-hashed URLs, so they must revalidate on every
    # load. Without an explicit Cache-Control, browsers heuristically cache
    # them for days (10% of last-modified age) and keep serving a stale
    # translation file after deploys: every new key silently falls back to
    # the bundled zh and English users see mixed-language UI.
    location /locales/ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    # Hero background image (un-hashed, stable filename) — long-cache so a page
    # refresh paints it from disk cache instead of re-fetching over the network
    # (root-level files otherwise fall through to `location /` with no
    # Cache-Control and get re-validated every load). Anchored to this exact
    # basename so it never shadows the hashed-and-immutable /assets/ files.
    # Not "immutable": the filename isn't content-hashed, so rename it if the
    # image ever changes.
    location ~* ^/landscape-bg\.(webp|png)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        include /etc/nginx/security-headers.conf;
    }

    # Use Docker DNS resolver so backend can be re-resolved after restarts
    resolver 127.0.0.11 valid=30s;
    set $upstream_backend http://backend:8000;

    # SSE streaming endpoint — must disable all buffering
    location /api/chat/stream {
        proxy_pass $upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        gzip off;
        # Prevent Cloudflare from compressing (gzip buffers entire response, breaking SSE)
        add_header Content-Encoding identity;
        proxy_hide_header Content-Encoding;
    }

    # Dynamic sitemap & RSS feed — proxy to backend
    location ~ ^/(sitemap.*\.xml|feed\.xml)$ {
        proxy_pass $upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SEO HTML for individual sutra pages — backend injects per-text
    # <title> + <meta description> + canonical so Googlebot (which doesn't
    # execute the React bundle) sees real metadata. The user's browser
    # still loads the same hashed JS bundle and React mounts on top.
    # Only matches /texts/{numeric_id} and /texts/{numeric_id}/read so
    # other /texts/* sub-routes (if any) keep falling through to the SPA.
    location ~ ^/texts/[0-9]+(/read)?$ {
        proxy_pass $upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Don't cache so a frontend redeploy is visible immediately
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/security-headers.conf;
    }

    # SSR-only dictionary headword landing pages. ~300k unique headwords —
    # largest single content surface in the platform. Pure backend render,
    # SPA has no /dict/:headword route. Headwords are arbitrary UTF-8 (Chinese
    # / Sanskrit / Pali / English), so the location must accept any path.
    location ~ ^/dict/.+ {
        proxy_pass $upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/security-headers.conf;
    }

    # SSR-only person landing pages. The SPA has no /persons/:id route,
    # so this is a pure backend-rendered surface targeted at search engines
    # and external citations. ~43k pages.
    location ~ ^/persons/[0-9]+$ {
        proxy_pass $upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/security-headers.conf;
    }

    # Shared Q&A deep links — backend injects per-question og:* / og:image
    # so Twitter / WeChat / Telegram crawlers don't see the homepage
    # landscape image for every shared link. Share IDs are 16-char
    # url-safe base64; loosened to [A-Za-z0-9_-] for forward compat.
    location ~ ^/share/qa/[A-Za-z0-9_-]+$ {
        proxy_pass $upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/security-headers.conf;
    }

    # Pre-built SEO pages — serve their own index.html with correct meta tags
    location = /search {
        try_files /search/index.html /index.html;
    }
    location = /sources {
        try_files /sources/index.html /index.html;
    }
    location = /kg {
        try_files /kg/index.html /index.html;
    }
    location = /collections {
        try_files /collections/index.html /index.html;
    }
    location = /dictionary {
        try_files /dictionary/index.html /index.html;
    }
    location = /topics {
        try_files /topics/index.html /index.html;
    }

    # Umami Analytics — self-hosted, privacy-first
    set $upstream_umami http://umami:3000;
    location /umami/ {
        proxy_pass $upstream_umami;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Research assistant: one request fans out into a plan + several retrievals
    # + a synthesis on a (reasoning-class) LLM, so it routinely runs 60-90s —
    # well past nginx's 60s default read timeout. Give this path more headroom
    # (still under the ~100s upstream CDN ceiling). More specific prefix than
    # /api/ below, so it wins for /api/research/*.
    location /api/research/ {
        proxy_pass $upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location /api/ {
        proxy_pass $upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OpenAPI docs — publicly accessible as the API documentation portal
    location /docs {
        proxy_pass $upstream_backend/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /redoc {
        proxy_pass $upstream_backend/redoc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /openapi.json {
        proxy_pass $upstream_backend/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Service worker must not be cached — ensures PWA picks up new versions
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        include /etc/nginx/security-headers.conf;
    }

    # SW registration/update helpers — Cloudflare caches bare .js for hours
    # by default, which delays SW updates for returning visitors
    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        include /etc/nginx/security-headers.conf;
    }

    location = /sw-update.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        include /etc/nginx/security-headers.conf;
    }

    # index.html must not be cached (references hashed assets)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        # Re-include security headers (nginx add_header in a location overrides server-level)
        include /etc/nginx/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
