# Carry the ORIGINAL client protocol through this hop instead of overwriting it.
#
# The chain is: Cloudflare (https) → host nginx → this container → backend.
# The host nginx already sets `X-Forwarded-Proto $scheme`, which on its :443
# server is "https". But every proxy_set_header below used *this* container's
# own $scheme — and the host→container hop is plain http — so the correct value
# was thrown away and the backend always saw "http". Consequence: every URL the
# backend built from request.base_url went out as http:// (og:url, JSON-LD url,
# breadcrumbs), while Cloudflare's Automatic HTTPS Rewrites patched only the
# href-bearing <link rel="canonical"> — leaving pages self-contradictory.
#
# Trusting the inbound header is safe *here specifically*: this container is
# published on 127.0.0.1 only (see FRONTEND_BIND in docker-compose.yml), so the
# header can only have come from the host nginx, which overwrites whatever the
# client sent. $scheme remains the fallback for direct/local access and for
# self-hosters running without a second proxy in front.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# ?lang= picks the prebuilt shell for that UI language (src/seo/buildShells.ts
# writes index.html / index.zh-Hant.html / index.en.html per route). Only zh-Hant
# and en open a variant (matched case-insensitively, as nginx map strings are —
# backend/app/services/seo_lang.py agrees); anything else, including ?lang=zh,
# gets the simplified shell, so junk values never become separately indexable.
# See docs/superpowers/specs/2026-10-11-i18n-seo-design.md.
# /verify?q=… result pages are an unbounded query space: keep them out of the
# index for crawlers that read headers but never run the page's JS (which adds
# <meta name="robots" content="noindex">). add_header skips empty values, so the
# bare /verify entry page carries no X-Robots-Tag at all.
map $arg_q $verify_robots {
    ""      "";
    default "noindex, follow";
}

map $arg_lang $lang_sfx {
    "zh-Hant" ".zh-Hant";
    "en"      ".en";
    default   "";
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # Security headers — see security-headers.conf. Must be re-included in every
    # location that sets its own add_header (nginx drops inherited headers there).
    include /etc/nginx/security-headers.conf;

    # nginx defaults to a 1 MiB request body, which silently voided the 10MB cap
    # that /api/chat/attachments advertises. On fojin.app the host nginx is what
    # actually rejects (it owns /api/ — see deploy/host-nginx/), but a plain
    # `docker compose up` with no proxy in front lands here instead, so this hop
    # needs the same ceiling or self-hosters hit the identical bug.
    # 12m, not 10m: nginx measures the whole multipart body, so an exactly-10MB
    # file must still get through to meet the app's own friendly 413.
    client_max_body_size 12m;

    # Serve pre-compressed .gz files when available
    gzip_static on;

    # Fallback dynamic gzip for non-precompressed responses
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Static assets with content hash — immutable long cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # Font files — long cache
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # i18n resource files — un-hashed URLs, so they must revalidate on every
    # load. Without an explicit Cache-Control, browsers heuristically cache
    # them for days (10% of last-modified age) and keep serving a stale
    # translation file after deploys: every new key silently falls back to
    # the bundled zh and English users see mixed-language UI.
    location /locales/ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    # Hero background image (un-hashed, stable filename) — long-cache so a page
    # refresh paints it from disk cache instead of re-fetching over the network
    # (root-level files otherwise fall through to `location /` with no
    # Cache-Control and get re-validated every load). Anchored to this exact
    # basename so it never shadows the hashed-and-immutable /assets/ files.
    # Not "immutable": the filename isn't content-hashed, so rename it if the
    # image ever changes.
    location ~* ^/landscape-bg\.(webp|png)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        include /etc/nginx/security-headers.conf;
    }

    # PWA icons + favicon — small, near-static, un-hashed root assets that
    # otherwise fall through to `location /` with no Cache-Control and get
    # re-validated every load. Long max-age (not immutable, since filenames
    # aren't content-hashed — rename if one ever changes).
    location /icons/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        include /etc/nginx/security-headers.conf;
    }
    location = /favicon.svg {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        include /etc/nginx/security-headers.conf;
    }

    # Use Docker DNS resolver so backend can be re-resolved after restarts
    resolver 127.0.0.11 valid=30s;
    set $upstream_backend http://backend:8000;

    # SSE streaming endpoint — must disable all buffering
    location /api/chat/stream {
        proxy_pass $upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        gzip off;
        # Prevent Cloudflare from compressing (gzip buffers entire response, breaking SSE)
        add_header Content-Encoding identity;
        proxy_hide_header Content-Encoding;
    }

    # Dynamic sitemap & RSS feed — proxy to backend
    location ~ ^/(sitemap.*\.xml|feed\.xml)$ {
        proxy_pass $upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    # SEO HTML for individual sutra pages — backend injects per-text
    # <title> + <meta description> + canonical so Googlebot (which doesn't
    # execute the React bundle) sees real metadata. The user's browser
    # still loads the same hashed JS bundle and React mounts on top.
    # Only matches /texts/{numeric_id} and /texts/{numeric_id}/read so
    # other /texts/* sub-routes (if any) keep falling through to the SPA.
    location ~ ^/texts/[0-9]+(/read)?$ {
        proxy_pass $upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        # Don't cache so a frontend redeploy is visible immediately
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/security-headers.conf;
    }

    # SSR-only dictionary headword landing pages. ~300k unique headwords —
    # largest single content surface in the platform. Pure backend render,
    # SPA has no /dict/:headword route. Headwords are arbitrary UTF-8 (Chinese
    # / Sanskrit / Pali / English), so the location must accept any path.
    location ~ ^/dict/.+ {
        proxy_pass $upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/security-headers.conf;
    }

    # SSR-only person landing pages. The SPA has no /persons/:id route,
    # so this is a pure backend-rendered surface targeted at search engines
    # and external citations. ~43k pages.
    location ~ ^/persons/[0-9]+$ {
        proxy_pass $upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/security-headers.conf;
    }

    # Shared Q&A deep links — backend injects per-question og:* / og:image
    # so Twitter / WeChat / Telegram crawlers don't see the homepage
    # landscape image for every shared link. Share IDs are 16-char
    # url-safe base64; loosened to [A-Za-z0-9_-] for forward compat.
    location ~ ^/share/qa/[A-Za-z0-9_-]+$ {
        proxy_pass $upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/security-headers.conf;
    }

    # Pre-built SEO pages — serve their own index.html with correct meta tags.
    #
    # Every route that has a dist/<route>/index.html MUST be listed here. It is
    # not just about meta tags: once the directory exists, `location /`'s
    # `try_files $uri $uri/ /index.html` matches $uri/ against a real directory
    # and nginx answers **301 → /<route>/**. That is exactly what /sutras/* has
    # been doing (sitemap submits the slash-less form, so every crawl burns an
    # extra hop), and what /chat would start doing the moment its shell landed.
    # An exact/regex location hands the file over directly — no redirect.
    location = /chat {
        try_files /chat/index$lang_sfx.html /chat/index.html /index.html;
        include /etc/nginx/html-no-cache.conf;
    }
    location ~ ^/sutras/([a-z0-9-]+)$ {
        try_files /sutras/$1/index$lang_sfx.html /sutras/$1/index.html /index.html;
        include /etc/nginx/html-no-cache.conf;
    }
    # Curated collection series and the cross-canon index have their own shells
    # too — before these existed, their server HTML said canonical = homepage.
    # Unknown collection ids fall through to the SPA shell (React renders 404).
    location ~ ^/collections/([a-z0-9-]+)$ {
        try_files /collections/$1/index$lang_sfx.html /collections/$1/index.html /index$lang_sfx.html /index.html;
        include /etc/nginx/html-no-cache.conf;
    }
    location = /verify {
        try_files /verify/index$lang_sfx.html /verify/index.html /index.html;
        include /etc/nginx/html-no-cache.conf;
        add_header X-Robots-Tag $verify_robots;
    }
    location = /cross-canon {
        try_files /cross-canon/index$lang_sfx.html /cross-canon/index.html /index.html;
        include /etc/nginx/html-no-cache.conf;
    }

    # Home page: its own shell (it alone carries the homepage hreflang — the
    # generic index*.html below is the fallback for every SPA route, so it must
    # not claim to be the homepage's language variants). Same no-cache headers
    # as /index.html.
    location = / {
        include /etc/nginx/html-no-cache.conf;
        try_files /_home/index$lang_sfx.html /_home/index.html /index.html;
    }
    # The home shell is only ever served via `location = /`; don't expose a
    # duplicate URL for it.
    location ^~ /_home/ {
        return 404;
    }
    location = /search {
        try_files /search/index$lang_sfx.html /search/index.html /index.html;
        include /etc/nginx/html-no-cache.conf;
    }
    location = /sources {
        try_files /sources/index$lang_sfx.html /sources/index.html /index.html;
        include /etc/nginx/html-no-cache.conf;
    }
    location = /kg {
        try_files /kg/index$lang_sfx.html /kg/index.html /index.html;
        include /etc/nginx/html-no-cache.conf;
    }
    location = /collections {
        try_files /collections/index$lang_sfx.html /collections/index.html /index.html;
        include /etc/nginx/html-no-cache.conf;
    }
    location = /dictionary {
        try_files /dictionary/index$lang_sfx.html /dictionary/index.html /index.html;
        include /etc/nginx/html-no-cache.conf;
    }
    # /topics 已永久并入 /collections（2026-10）。两页标题都叫「经典专题」、
    # /topics 的 8 个专题全是 /collections 13 个系列的子集，同名页互抢排名。
    # 一条正则吃掉所有旧形态：大小写变体、尾斜杠、旧 shell 文件路径
    # （/topics/index.en.html）。$is_args$args 保留查询串（?lang=en 要跟过去；
    # 裸 `return 301 /collections;` 会把它吞掉）。/topics 从没有过逐专题的
    # URL（展开状态是组件内 useState），所以没有可映射到 /collections/:id 的深链。
    # 目标 /collections 不匹配本正则，不会循环。
    location ~ "^/(?i:topics)(/.*)?$" {
        return 301 /collections$is_args$args;
    }

    # Agent portal — a hand-written standalone page in public/, not an SPA
    # route, so it maps to a *file* rather than a <route>/index.html. Same
    # reason for the exact location though: without it /agents falls into
    # `location /`, which has no dist/agents/ directory to match and hands
    # back the SPA shell — and React Router has no /agents route, so a human
    # would land on the 404 page.
    location = /agents {
        try_files /agents.html /index.html;
    }

    # llms.txt is UTF-8 and, unlike an HTML page, has nowhere in-band to say
    # so. nginx's `charset` is off by default, so it went out as bare
    # `text/plain` and the browser fell back to a legacy encoding: the title
    # rendered as "fojin 浣涙触" instead of "fojin 佛津". Byte-level consumers
    # (curl, crawlers, agents) were fine, which is why every non-browser check
    # passed. Scoped to this file rather than set server-wide so nothing else
    # changes its Content-Type; any future UTF-8 .txt needs the same line.
    location = /llms.txt {
        charset utf-8;
    }

    # 上面这批路由的大小写变体 → 301 回规范小写。
    #
    # 对用户来说 /CHAT 其实是能用的：React Router 的路径匹配默认不区分大小写，
    # ChatPage 照常渲染。坏的是**外壳** —— `location = /chat` 是精确匹配、大小写
    # 敏感，/CHAT 落进 `location /` 拿到的是通用 index.html，于是 <title> 是首页
    # 的、`rel=canonical` 指向 https://fojin.app/。爬虫读到的意思是「这一页就是
    # 首页」，而站内并没有第二个 /chat 应该被折叠掉。（生产实测，2026-08-05。）
    # Umami 30 天：/CHAT 123 次浏览、29 个会话，其中 26 个是从站外直接进来的。
    #
    # `(?!chat$)` 那个否定前瞻不是装饰：没有它，这条正则也匹配规范小写，一旦
    # 上面的 `location = /chat` 哪天被删/改名，这里就变成 /chat → 301 /chat 的
    # 死循环。有了它，小写形式在正则层面就匹配不上，不依赖 location 优先级。
    # nginx 没有内建的小写函数，所以跳转目标只能写死。
    location ~ "^/(?!chat$)(?i:chat)$"             { return 301 /chat$is_args$args; }
    location ~ "^/(?!search$)(?i:search)$"         { return 301 /search$is_args$args; }
    location ~ "^/(?!sources$)(?i:sources)$"       { return 301 /sources$is_args$args; }
    location ~ "^/(?!kg$)(?i:kg)$"                 { return 301 /kg$is_args$args; }
    location ~ "^/(?!collections$)(?i:collections)$" { return 301 /collections$is_args$args; }
    location ~ "^/(?!dictionary$)(?i:dictionary)$" { return 301 /dictionary$is_args$args; }
    location ~ "^/(?!agents$)(?i:agents)$"         { return 301 /agents$is_args$args; }
    location ~ "^/(?!cross-canon$)(?i:cross-canon)$" { return 301 /cross-canon$is_args$args; }
    location ~ "^/(?!verify$)(?i:verify)$"           { return 301 /verify$is_args$args; }

    # Umami Analytics — self-hosted, privacy-first
    set $upstream_umami http://umami:3000;
    location /umami/ {
        proxy_pass $upstream_umami;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    # Research assistant: one request fans out into a plan + several retrievals
    # + a synthesis on a (reasoning-class) LLM, so it routinely runs 60-90s —
    # well past nginx's 60s default read timeout. Give this path more headroom
    # (still under the ~100s upstream CDN ceiling). More specific prefix than
    # /api/ below, so it wins for /api/research/*.
    location /api/research/ {
        proxy_pass $upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location /api/ {
        proxy_pass $upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    # OpenAPI docs — publicly accessible as the API documentation portal
    location /docs {
        proxy_pass $upstream_backend/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }
    location /redoc {
        proxy_pass $upstream_backend/redoc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }
    location /openapi.json {
        proxy_pass $upstream_backend/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    # Service worker must not be cached — ensures PWA picks up new versions
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        include /etc/nginx/security-headers.conf;
    }

    # SW registration/update helpers — Cloudflare caches bare .js for hours
    # by default, which delays SW updates for returning visitors
    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        include /etc/nginx/security-headers.conf;
    }

    location = /sw-update.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        include /etc/nginx/security-headers.conf;
    }

    # index.html must not be cached (references hashed assets)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        # Re-include security headers (nginx add_header in a location overrides server-level)
        include /etc/nginx/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ @spa;
    }

    # SPA fallback in the visitor's UI language. A named location (not a plain
    # try_files file argument) so the shell is served with the same no-cache
    # headers as /index.html: it references hashed asset names, and a cached
    # copy outliving a deploy would point at bundles that no longer exist.
    location @spa {
        include /etc/nginx/html-no-cache.conf;
        try_files /index$lang_sfx.html /index.html;
    }
}
