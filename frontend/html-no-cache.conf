# HTML shells reference hashed bundle names (/assets/index-<hash>.js). A cached
# shell that outlives a deploy points at bundles that no longer exist → blank
# page. Every location that serves an HTML shell includes this. nginx drops
# inherited add_header in any location that sets its own, so the security
# headers are re-included here too.
add_header Cache-Control "no-cache, no-store, must-revalidate";
add_header Pragma "no-cache";
add_header Expires "0";
include /etc/nginx/security-headers.conf;
