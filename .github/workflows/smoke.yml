name: Production smoke

# Post-deploy monitoring, NOT a PR gate — never mark this workflow as a
# required check (it doesn't run on PRs at all).
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Target base URL"
        default: "https://fojin.app"
        required: false
  schedule:
    - cron: "17 1,13 * * *" # twice daily, UTC
  # Fire only AFTER a deploy actually succeeds — not on push. Running on
  # push raced the webhook CD and produced systematic false negatives:
  # the suite hit prod before backend/DB/SSR rolled out, so an i18n/DB/SSR
  # push could go red and the *next* unrelated run would flip it green.
  # Intent: the VPS deploy.sh health check, once it passes, triggers this
  # via `gh api repos/xr843/fojin/dispatches -f event_type=deploy-success`
  # — i.e. "test only once the deploy has completed."
  repository_dispatch:
    types: [deploy-success]

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Smoke against production
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # Drift watchdog for scheduled runs. The dispatch path below asserts the
      # deploy that just finished; this asserts CD is alive AT ALL. The 2026-07
      # incident: dirty VPS worktree made every ff-merge abort, prod silently
      # froze for 1.5 days while webhooks returned 200 — the only red signal
      # was an indirect locale-count assertion. Compare what prod actually
      # runs (/api/version) against master; allow a grace window so a deploy
      # racing a fresh merge doesn't false-alarm.
      - name: Assert production tracks master (drift watchdog)
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SERVED=$(curl -sf --max-time 15 -A 'fojin-smoke' https://fojin.app/api/version \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).commit||''))" 2>/dev/null || echo "")
          if [ -z "$SERVED" ]; then
            echo "::error::/api/version unreachable or missing commit — backend down or running pre-versioning code."
            exit 1
          fi
          echo "prod: $SERVED / master: $GITHUB_SHA"
          [ "$SERVED" = "$GITHUB_SHA" ] && { echo "in sync"; exit 0; }
          CMP=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${SERVED}...${GITHUB_SHA}" 2>/dev/null) || {
            echo "::error::prod commit $SERVED is unknown to this repo — investigate what is deployed."
            exit 1
          }
          BEHIND=$(echo "$CMP" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).ahead_by))")
          HEAD_DATE=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" --jq '.commit.committer.date')
          AGE_MIN=$(( ($(date +%s) - $(date -d "$HEAD_DATE" +%s)) / 60 ))
          echo "prod is $BEHIND commit(s) behind; master head is ${AGE_MIN}min old"
          if [ "$BEHIND" -gt 0 ] && [ "$AGE_MIN" -gt 120 ]; then
            echo "::error::Production is $BEHIND commit(s) behind a master that has been quiet for ${AGE_MIN}min — CD looks stalled (check VPS deploy.log / worktree cleanliness)."
            exit 1
          fi
          echo "lag within grace window (master head <120min old) — CD may still be rolling out"

      - name: Wait for deployed backend commit
        if: github.event_name == 'repository_dispatch'
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://fojin.app' }}
          EXPECTED_SHA: ${{ github.event.client_payload.commit || github.sha }}
        run: |
          echo "expected backend commit: $EXPECTED_SHA"
          for i in $(seq 1 24); do
            SERVED=$(curl -sf --max-time 10 "$BASE_URL/api/version" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).commit || ''))" 2>/dev/null || echo "")
            if [ "$SERVED" = "$EXPECTED_SHA" ]; then
              echo "backend commit in sync after $((i*30))s ($SERVED)"
              exit 0
            fi
            echo "waiting for backend commit... served=${SERVED:-unavailable} ($((i*30))s)"
            sleep 30
          done
          echo "::error::Production backend did not report expected commit $EXPECTED_SHA"
          exit 1

      - name: Wait for frontend locale
        if: github.event_name == 'repository_dispatch'
        run: |
          REPO_KEYS=$(node -e "console.log(Object.keys(require('../frontend/public/locales/en/translation.json')).length)")
          echo "repo en keys: $REPO_KEYS"
          for i in $(seq 1 24); do
            SERVED=$(curl -sf -A 'Mozilla/5.0' --max-time 10 https://fojin.app/locales/en/translation.json | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(Object.keys(JSON.parse(d)).length))" 2>/dev/null || echo -1)
            if [ "$SERVED" = "$REPO_KEYS" ]; then
              echo "locale in sync after $((i*30))s (served=$SERVED)"
              exit 0
            fi
            echo "waiting for CD... served=$SERVED ($((i*30))s)"
            sleep 30
          done
          echo "::warning::CD rollout not confirmed after 12min — testing anyway"

      - name: Install Playwright
        run: npm ci && npx playwright install --with-deps chromium

      - name: Run smoke suite
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://fojin.app' }}
        run: npx playwright test

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: e2e/test-results/
          retention-days: 7
