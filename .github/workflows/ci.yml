name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  backend:
    name: Backend smoke tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: pip install ruff==0.9.7 && ruff check app/ eval/

      - name: Run tests
        # Coverage is MEASURED for the chat-pipeline core (chat orchestration,
        # RAG retrieval, citation guard) so drift shows up in the job log —
        # deliberately no threshold gate yet. Baseline at introduction
        # (2026-07-04): chat 56%, rag_retrieval 47%, citation_guard 96%.
        run: >
          python -m pytest -q tests/
          --cov=app.services.chat
          --cov=app.services.rag_retrieval
          --cov=app.services.citation_guard
          --cov-report=term

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npx eslint src/ --max-warnings 0

      - name: i18n ratchet (no new hardcoded Chinese + no undefined keys)
        run: npm run i18n:check

      - name: Type check
        run: npx tsc -b --noEmit

      - name: Unit tests (Vitest)
        run: npx vitest run

      - name: Build (Vite)
        run: npx vite build

  worker-prerender:
    name: Worker prerender typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/prerender
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/prerender/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck
