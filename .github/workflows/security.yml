name: Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Check for leaked secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for hardcoded secrets
        run: |
          echo "Scanning for potential secret patterns..."
          FOUND=0

          # Real API key patterns (high-confidence)
          if git grep -inE 'sk-[a-zA-Z0-9]{20,}' -- ':(exclude)*.example' ':(exclude)*.md' ':(exclude)*.yml' ':(exclude)*.yaml' ':(exclude)node_modules'; then
            echo "::error::Possible API key found in source code"
            FOUND=1
          fi

          if git grep -inE 'ghp_[a-zA-Z0-9]{30,}' -- ':(exclude)*.example' ':(exclude)*.md'; then
            echo "::error::GitHub token found in source code"
            FOUND=1
          fi

          if git grep -inE 'apify_api_[a-zA-Z0-9]{20,}' -- ':(exclude)*.example' ':(exclude)*.md'; then
            echo "::error::Apify token found in source code"
            FOUND=1
          fi

          # Check for .env files committed
          if git ls-files | grep -E '^\.env$|/\.env$' | grep -v '.example'; then
            echo "::error::.env file committed to repository"
            FOUND=1
          fi

          if [ $FOUND -eq 1 ]; then
            exit 1
          fi
          echo "No secrets found."

  bandit:
    name: Python SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit on backend
        run: bandit -r backend/app/ --severity-level medium --confidence-level medium -f json -o bandit-report.json || true

      - name: Display bandit results
        if: always()
        run: bandit -r backend/app/ --severity-level medium --confidence-level medium

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: bandit-report.json

  pip-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: pip-audit --desc --output pip-audit-report.json --format json || true

      - name: Display pip-audit results
        if: always()
        # CVE-2026-4539: existing waiver.
        # CVE-2026-3219 (pip 26.0.1 archive confusion): affects `pip install` on
        #   crafted archives only; CI uses pinned wheels from PyPI.
        # CVE-2026-6357 (pip 26.0.1 self-update import race, fix in 26.1):
        #   runner-level pip, not a FoJin dependency. CI uses pinned wheels and
        #   doesn't invoke `pip install --upgrade pip` post-deploy. Waive until
        #   the GitHub Actions Python toolcache ships 26.1.
        # PYSEC-2026-196 (pip 26.1.1 console_scripts path traversal, fix in 26.1.2):
        #   same runner-level scope as above; FoJin doesn't run `pip install` on
        #   untrusted entry-point packages. Waive until toolcache ships 26.1.2.
        run: pip-audit --desc --ignore-vuln CVE-2026-4539 --ignore-vuln CVE-2026-3219 --ignore-vuln CVE-2026-6357 --ignore-vuln PYSEC-2026-196

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pip-audit-report
          path: backend/pip-audit-report.json

  npm-audit:
    name: Frontend dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        # --audit-level=high: block on high/critical; treat moderate/low as
        # informational (still visible in the JSON report + full audit below).
        # Waiver reason — react-router GHSA-wrjc-x8rr-h8h6 (open redirect via
        #   backslash in <Link>/useNavigate) and GHSA-337j-9hxr-rhxg (constructor
        #   injection in SSR-hydration deserializeErrors) are both *moderate* and
        #   fixed only by react-router-dom 7.x, a breaking major upgrade. FoJin's
        #   frontend is a client-side Vite SPA (no react-router SSR hydration), so
        #   GHSA-337j does not apply; GHSA-wrjc is low-relevance (no user-controlled
        #   URLs passed to Link/navigate). Tracked for a proper v7 migration; until
        #   then don't fail CI on these moderates or block unrelated PRs.
        run: |
          npm audit --omit=dev --audit-level=high
          echo "--- full prod advisories (informational, does not gate) ---"
          npm audit --omit=dev || true

      - name: Run npm audit (JSON report)
        if: always()
        run: npm audit --omit=dev --json > npm-audit-report.json || true

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-report
          path: frontend/npm-audit-report.json

  worker-prerender-npm-audit:
    name: Worker prerender dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/prerender
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: workers/prerender/package-lock.json

      - name: Install dependencies
        run: npm ci

      # --omit=dev: the only vulns here (e.g. sharp/libvips highs, GHSA-f88m-g3jw-g9cj)
      # come in transitively via wrangler, a build-time devDependency. The deployed
      # Cloudflare Worker runtime contains no such native modules, so they carry zero
      # production exposure. Audit production deps only, matching the frontend job.
      - name: Run npm audit
        run: npm audit --omit=dev

      - name: Run npm audit (JSON report)
        if: always()
        run: npm audit --omit=dev --json > npm-audit-report.json || true

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: worker-prerender-npm-audit-report
          path: workers/prerender/npm-audit-report.json
