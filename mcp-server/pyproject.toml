[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fojin-mcp"
version = "0.4.0"
description = "MCP server exposing fojin's verified cross-canon Buddhist corpus (cited, URN-addressable passages) to AI research tools."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "fojin (佛津)" }]
keywords = ["mcp", "buddhism", "cbeta", "digital-humanities", "rag", "llm-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Religion",
    "Topic :: Text Processing :: Linguistic",
]
# mcp 2.x is required: 2.0 removed the 1.x `mcp.server.fastmcp` module this
# package previously imported, so 0.1.0 breaks on any fresh install that
# resolves mcp>=1.2 to 2.x. 0.2.0 is the v2 migration.
dependencies = [
    "mcp>=2,<3",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://fojin.app"
Repository = "https://github.com/xr843/fojin"
Issues = "https://github.com/xr843/fojin/issues"

[project.optional-dependencies]
http = [
    "uvicorn>=0.30",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
fojin-mcp = "fojin_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["fojin_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
